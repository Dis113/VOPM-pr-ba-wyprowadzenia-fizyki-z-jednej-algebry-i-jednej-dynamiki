name: Lean formal checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel obsolete PR builds when a newer commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap elan
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve locked Lean dependencies
        run: lake update
      - uses: leanprover/lean-action@v1
        with:
          build: "true"
          test: "false"
          lint: "false"
          # Independent leanchecker segfaults (exit 139) on pinned mathlib/Lean RC.
          # Compilation is still kernel-checked by Lean; investigate separately.
          leanchecker: "false"
          # CI disk-space failure in actions/cache/save after a SUCCESSFUL
          # Lean build. Disable .lake GitHub caching; mathlib's separate
          # upstream precompiled artifact cache remains available.
          use-github-cache: "false"
      - name: Reject placeholder proofs
        run: |
          if grep -RInE '\b(sorry|admit|axiom)\b' VOPM VOPM.lean; then
            echo "Placeholders or new axioms detected in VOPM sources."
            exit 1
          fi

      - name: Validate E8 primitive coordinates
        run: python3 checks/check_e8_basis.py

      - name: Validate octonionic generator table
        run: python3 checks/check_octonion_coin.py

      - name: Validate associator Hamiltonian independently
        run: python3 checks/check_associator.py

      - name: Published E8 design and G2 spectral controls
        run: python3 checks/literature_benchmarks.py

      - name: Exact E8 to integral-octavian unit certificate
        run: python3 checks/check_octavian_bridge.py

      - name: Exact two-site octavian 64x64 gate test
        run: python3 checks/check_octavian_gate.py

      - name: Octavian holonomy and E8-triangle oriented Wilson diagnostics
        run: python3 checks/check_octavian_holonomy.py

      - name: Clifford trace blindspot and G2 four-edge control
        run: python3 checks/check_g2_trace_blindspot.py

      - name: Gauge-covariant positive hopping and unique vacuum
        run: python3 checks/check_covariant_gapped_vacuum.py

      - name: Quantized Z2 octavian link Gauss covariance and parent gap
        run: python3 checks/check_dynamic_links.py

      - name: Magnetic octavian E8 plaquette and exact physical spectrum
        run: python3 checks/check_dynamic_plaquette.py

      - name: Exact 240-state quantum octavian core and spectral orthogonality no-go
        run: python3 checks/check_quantum_octavian_core.py
